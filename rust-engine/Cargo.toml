[package]
name = "wled-video-sync-rust"
version = "1.1.3"
edition = "2021"
authors = ["AI Studio WLED Video Sync Team"]
description = "Ultra-low-latency Linux Wayland & OMT to WLED/DMX (DDP, Art-Net 4, sACN) Video Sync Engine in Rust"
license = "MIT"

[dependencies]
# Async Runtime & Networking
tokio = { version = "1.38", features = ["full"] }
tokio-stream = "0.1"
socket2 = { version = "0.5", features = ["all"] }
byteorder = "1.5"

# Web Server & WebSockets
axum = { version = "0.7", features = ["ws", "macros"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }

# Parallel Processing & SIMD Math
rayon = "1.10"

# Serialization & Configuration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging & Telemetry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error Handling
anyhow = "1.0"
thiserror = "1.0"

# mDNS for Open Media Transport (OMT) Discovery
mdns-sd = "0.11"

# Command line parsing
clap = { version = "4.5", features = ["derive"] }

[features]
default = []
# Enable native PipeWire Linux Wayland capture
wayland-pipewire = ["dep:pipewire", "dep:ashpd"]
# Enable real Open Media Transport (OMT) receiving via the pure-Rust
# `openmediatransport` crate (VMX codec). Optional so the core engine keeps
# building with no extra dependencies.
omt = ["dep:openmediatransport"]

# Pinned exactly: this crate is very new (0.1.0) and unproven at the edges.
[dependencies.openmediatransport]
version = "=0.1.0"
optional = true

[dependencies.pipewire]
version = "0.8"
optional = true

[dependencies.ashpd]
version = "0.8"
features = ["pipewire"]
optional = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
